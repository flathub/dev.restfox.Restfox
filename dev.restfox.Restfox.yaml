app-id: dev.restfox.Restfox
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: restfox
rename-desktop-file: restfox.desktop
rename-icon: dev.restfox.Restfox
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
separate-locales: false
finish-args:
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
modules:
  - name: restfox
    build-commands:
      - ar -o -x restfox.deb
      - tar --extract --file data.tar.gz
      - cp --preserve --recursive usr/* /app
      - desktop-file-edit --set-key Exec --set-value "restfox %U" /app/share/applications/restfox.desktop
      - install -D --mode 0644 /app/lib/restfox/resources/app/ui/favicon.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -D --mode 0644 --target-directory /app/share/metainfo/ ${FLATPAK_ID}.metainfo.xml
      - install -D --mode 0755 entrypoint.sh /app/bin/restfox
    buildsystem: simple
    sources:
      - type: file
        path: dev.restfox.Restfox.metainfo.xml
      - type: file
        dest-filename: restfox.deb
        sha256: ffb5414164be6cf56cb397ecd58909b541977abb7a2aa2b972c7a111d670bae0
        url: https://github.com/flawiddsouza/Restfox/releases/download/v0.42.0/restfox_0.42.0_amd64.deb
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/flawiddsouza/Restfox/releases/latest
          url-query: .assets[] | select(.name == "restfox_" + $version + "_amd64.deb") | .browser_download_url
          version-query: .tag_name | sub("^v"; "")
      - type: script
        commands:
          - export TMPDIR="${XDG_RUNTIME_DIR}/app/${FLATPAK_ID}"
          - '# Electron picks Wayland only when XDG_SESSION_TYPE is wayland, which can'
          - '# disagree with the one display the sandbox received, so name that one.'
          - '# WAYLAND_DISPLAY stays set without the socket, so check the socket.'
          - case "${WAYLAND_DISPLAY:-wayland-0}" in
          - '  /*) wayland_socket="${WAYLAND_DISPLAY}" ;;'
          - '  *) wayland_socket="${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:-wayland-0}" ;;'
          - esac
          - if [ -S "$wayland_socket" ] && [ -z "$DISPLAY" ]; then
          - '  set -- --ozone-platform=wayland "$@"'
          - elif [ -n "$DISPLAY" ] && [ ! -S "$wayland_socket" ]; then
          - '  set -- --ozone-platform=x11 "$@"'
          - fi
          - exec zypak-wrapper /app/lib/restfox/Restfox "$@"
        dest-filename: entrypoint.sh
